name: Build ImmortalWrt RAX3000M NAND (Official 25.12 Stable)

on:
  workflow_dispatch:
    inputs:
      release:
        description: '发布到 Release'
        required: true
        default: true
        type: boolean

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: v25.12.1
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Init build environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          docker rmi $(docker images -q) 2>/dev/null || true
          sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo apt update -y
          sudo apt full-upgrade -y
          sudo apt install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler ecj fastjar flex gawk gettext gcc-multilib \
            g++-multilib git gnutls-dev gperf haveged help2man intltool lib32gcc-s1 libc6-dev-i386 libelf-dev \
            libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses-dev libpython3-dev \
            libreadline-dev libssl-dev libtool libyaml-dev libz-dev lld llvm lrzsz mkisofs msmtp nano \
            ninja-build p7zip p7zip-full patch pkgconf python3 python3-pip python3-ply python3-docutils \
            python3-pyelftools qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo uglifyjs \
            upx-ucl unzip vim wget xmlto xxd zlib1g-dev zstd
          sudo apt autoremove --purge -y
          sudo apt clean -y
          sudo timedatectl set-timezone "$TZ"

      - name: Clone source code
        run: |
          git clone --single-branch --filter=blob:none -b $REPO_BRANCH $REPO_URL openwrt
          cd openwrt
          echo "源码分支: $(git branch -a)"
          echo "最新提交: $(git log -1 --pretty=format:'%h %s')"

           - name: DIY Part1 - Before feeds update
        run: |
          cd openwrt
          
          # ========== 克隆 sirpdboy 插件 ==========
          echo "===== 克隆 sirpdboy 插件 ====="
          git clone --depth=1 https://github.com/sirpdboy/luci-theme-kucat.git package/luci-theme-kucat
          git clone --depth=1 https://github.com/sirpdboy/luci-app-kucat-config.git package/luci-app-kucat-config
          git clone --depth=1 https://github.com/sirpdboy/luci-app-netwizard.git package/luci-app-netwizard
          git clone --depth=1 https://github.com/sirpdboy/luci-app-partexp.git package/luci-app-partexp
          git clone --depth=1 https://github.com/sirpdboy/luci-app-taskplan.git package/luci-app-taskplan
          git clone --depth=1 https://github.com/sirpdboy/netspeedtest.git package/luci-app-netspeedtest
          git clone --depth=1 https://github.com/sirpdboy/luci-app-eqosplus.git package/luci-app-eqosplus
          
          # ========== 克隆其他指定插件 ==========
          echo "===== 克隆 bandix & wechatpush ====="
          git clone --depth=1 https://github.com/timsaya/luci-app-bandix.git package/luci-app-bandix
          git clone --depth=1 --filter=blob:none --sparse https://github.com/kenzok8/openwrt-packages.git package/kenzok8-temp
          cd package/kenzok8-temp
          git sparse-checkout set luci-app-wechatpush
          mv luci-app-wechatpush ../luci-app-wechatpush
          cd ../..
          rm -rf package/kenzok8-temp
          
          echo "✅ 所有自定义插件克隆完成"
          ls -la package/ | grep -E "kucat|netwizard|partexp|taskplan|netspeedtest|eqosplus|bandix|wechatpush"
          
          # ========== 预检：确认本地克隆包是否存在 ==========
          echo ""
          echo "========== 本地克隆包预检 =========="
          CLONE_PKGS="luci-theme-kucat luci-app-kucat-config luci-app-netwizard luci-app-partexp luci-app-taskplan luci-app-netspeedtest luci-app-eqosplus luci-app-bandix luci-app-wechatpush"
          CLONE_MISSING=""
          for pkg in $CLONE_PKGS; do
            if [ -d "package/$pkg" ]; then
              echo "✅ package/$pkg 存在"
            else
              echo "❌ package/$pkg 不存在！"
              CLONE_MISSING="$CLONE_MISSING $pkg"
            fi
          done
          
          if [ -n "$CLONE_MISSING" ]; then
            echo ""
            echo "⚠️  以下包克隆失败或路径不匹配："
            echo "  $CLONE_MISSING"
            echo ""
            echo "📂 当前 package/ 目录下实际存在的目录："
            ls -d package/*/ 2>/dev/null | sed 's|package/||;s|/$||' | sort
            echo ""
            echo "💡 请检查 git clone 的目标路径是否与验证列表中的包名一致"
            echo "❌ 预检失败，终止编译"
            exit 1
          fi
          echo "✅ 所有本地克隆包预检通过"
          echo "======================================"
          
          if [ -f "$GITHUB_WORKSPACE/diy-part1.sh" ]; then
            chmod +x "$GITHUB_WORKSPACE/diy-part1.sh"
            "$GITHUB_WORKSPACE/diy-part1.sh"
          else
            echo "diy-part1.sh 不存在，跳过"
          fi
      - name: Add custom feeds
        run: |
          cd openwrt
          sed -i '/^src-git packages/d' feeds.conf.default
          echo "src-git packages https://github.com/immortalwrt/packages.git;openwrt-25.12" >> feeds.conf.default
          echo "src-git passwall https://github.com/Openwrt-Passwall/openwrt-passwall2.git;main" >> feeds.conf.default
          echo "src-git small https://github.com/kenzok8/small.git" >> feeds.conf.default
          echo "src-git kenzok8 https://github.com/kenzok8/openwrt-packages.git" >> feeds.conf.default
          echo "src-git istore https://github.com/linkease/istore.git;main" >> feeds.conf.default
          echo "src-git fantastic https://github.com/fantastic-packages/fantastic-packages-feeds.git" >> feeds.conf.default
          echo "src-git sbwml https://github.com/sbwml/openwrt_helloworld.git" >> feeds.conf.default
          echo "src-git sbwml_pkgs https://github.com/sbwml/openwrt_pkgs.git" >> feeds.conf.default
          echo "===== Feeds 配置 ====="
          cat feeds.conf.default

      - name: Update and install feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          echo ""
          echo "========== Feeds 验证 =========="
         
