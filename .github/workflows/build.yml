name: Build ImmortalWrt RAX3000M NAND (Official 25.12 Stable)

on:
  workflow_dispatch:
    inputs:
      release:
        description: '发布到 Release'
        required: true
        default: true
        type: boolean

env:
  # ==========================================
  # 源码配置 - ImmortalWrt 官方 25.12 稳定版
  # ==========================================
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: openwrt-25.12

  # 时区
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      # ---------- 1. 检出仓库 ----------
      - name: Checkout
        uses: actions/checkout@v4

      # ---------- 2. 初始化编译环境 ----------
      - name: Init build environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          docker rmi $(docker images -q) 2>/dev/null || true
          sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force

          sudo apt update -y
          sudo apt full-upgrade -y
          sudo apt install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler ecj fastjar flex gawk gettext gcc-multilib \
            g++-multilib git gnutls-dev gperf haveged help2man intltool lib32gcc-s1 libc6-dev-i386 libelf-dev \
            libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses-dev libpython3-dev \
            libreadline-dev libssl-dev libtool libyaml-dev libz-dev lld llvm lrzsz mkisofs msmtp nano \
            ninja-build p7zip p7zip-full patch pkgconf python3 python3-pip python3-ply python3-docutils \
            python3-pyelftools qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo uglifyjs \
            upx-ucl unzip vim wget xmlto xxd zlib1g-dev zstd

          sudo apt autoremove --purge -y
          sudo apt clean -y
          sudo timedatectl set-timezone "$TZ"

      # ---------- 3. 克隆源码 ----------
      - name: Clone source code
        run: |
          git clone --single-branch --filter=blob:none -b $REPO_BRANCH $REPO_URL openwrt
          cd openwrt
          echo "源码分支: $(git branch -a)"
          echo "最新提交: $(git log -1 --pretty=format:'%h %s')"

      # ---------- 4. DIY Part 1 - 更新 feeds 前 ----------
      - name: DIY Part1 - Before feeds update
        run: |
          if [ -f "$GITHUB_WORKSPACE/diy-part1.sh" ]; then
            chmod +x "$GITHUB_WORKSPACE/diy-part1.sh"
            cd openwrt
            "$GITHUB_WORKSPACE/diy-part1.sh"
          else
            echo "diy-part1.sh 不存在，跳过"
          fi

      # ---------- 5. 添加第三方 feeds ----------
      - name: Add custom feeds
        run: |
          cd openwrt

          # small 包 (代理工具依赖)
          echo "src-git small https://github.com/kenzok8/small.git" >> feeds.conf.default

          # kenzok8 插件库
          echo "src-git kenzok8 https://github.com/kenzok8/openwrt-packages.git" >> feeds.conf.default

          # iStore 应用商店
          echo "src-git istore https://github.com/linkease/istore.git" >> feeds.conf.default

          # Momo 监控
          echo "src-git momo https://github.com/nikkinikki-org/OpenWrt-momo.git;main" >> feeds.conf.default

          echo "===== Feeds 配置 ====="
          cat feeds.conf.default

      # ---------- 6. 更新 & 安装 feeds ----------
      - name: Update and install feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # ---------- 7. DIY Part 2 - 加载配置后 ----------
      - name: DIY Part2 - After feeds install
        run: |
          [ -d files ] && mv files openwrt/files || true
          if [ -f "$GITHUB_WORKSPACE/diy-part2.sh" ]; then
            chmod +x "$GITHUB_WORKSPACE/diy-part2.sh"
            cd openwrt
            "$GITHUB_WORKSPACE/diy-part2.sh"
          else
            echo "diy-part2.sh 不存在，跳过"
          fi

      # ---------- 8. 加载设备配置 ----------
      - name: Load device config
        run: |
          cd openwrt

          # 加载用户自定义软件包配置
          if [ -f ../.config ]; then
            echo "===== 加载用户自定义配置 ====="
            cp ../.config .config
          else
            echo "⚠️ 未找到用户自定义 .config"
            exit 1
          fi

          # 确保选中 RAX3000M NAND 设备 (25.12 属于 filogic target)
          cat >> .config <<EOF
          CONFIG_TARGET_mediatek=y
          CONFIG_TARGET_mediatek_filogic=y
          CONFIG_TARGET_mediatek_filogic_DEVICE_cmcc_rax3000m=y
          EOF

          make defconfig

          # 配置检查与报告
          echo ""
          echo "========== 配置检查报告 =========="
          echo ""
          echo "--- 目标设备 ---"
          grep "CONFIG_TARGET.*DEVICE.*=y" .config | head -5
          echo ""
          echo "--- 被丢弃的包 (用户要求但未编入) ---"
          comm -23 \
            <(grep "^CONFIG_PACKAGE_.*=y" ../.config | sed 's/=y//' | sort) \
            <(grep "^CONFIG_PACKAGE_.*=y" .config | sed 's/=y//' | sort) \
            || echo "(无丢弃)"
          echo ""
          echo "--- 最终编入的 luci-app 插件 ---"
          grep "^CONFIG_PACKAGE_luci-app-.*=y" .config | sed 's/CONFIG_PACKAGE_//;s/=y//' | sort
          echo ""
          echo "--- 最终编入的其他包 ---"
          grep "^CONFIG_PACKAGE_.*=y" .config | grep -v "luci-app-\|luci-i18n-\|luci-theme-\|luci-lib-\|kmod-" | sed 's/CONFIG_PACKAGE_//;s/=y//' | sort
          echo "=================================="

      # ---------- 9. 下载源码包 ----------
      - name: Download package sources
        run: |
          cd openwrt
          make download -j$(nproc)
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;

      # ---------- 10. 编译固件 ----------
      - name: Compile firmware
        run: |
          cd openwrt
          make -j$(nproc) || make -j1 V=s
          echo "===== 编译完成 ====="
          find bin/targets/ -type f \( -name "*.bin" -o -name "*.itb" \) | head -20

      # ---------- 11. 生成 Release Notes ----------
      - name: Generate Release Notes
        id: notes
        run: |
          cd openwrt
          KERNEL_VER=$(grep "LINUX_VERSION-6.12" include/kernel-6.12 2>/dev/null | awk -F'=' '{print $2}' | tr -d ' ' || echo "6.12.x")
          SYSTEM_VER=$(cat version.date 2>/dev/null || echo "25.12-SNAPSHOT")
          PLUGINS=$(grep "CONFIG_PACKAGE_luci-app-" .config | grep "=y" | sed 's/CONFIG_PACKAGE_//g' | sed 's/=y//g' | sort | tr '\n' ', ' | sed 's/,$//')

          cat > release_notes.txt <<EOF
          ### ImmortalWrt RAX3000M NAND 官方 25.12 稳定版固件

          **编译时间**: $(date +"%Y-%m-%d %H:%M:%S")
          **系统版本**: ImmortalWrt $SYSTEM_VER (官方 25.12 稳定版)
          **Linux 内核**: $KERNEL_VER
          **目标设备**: CMCC RAX3000M (MT7981 / NAND 128M)
          **目标平台**: mediatek/filogic
          **无线驱动**: mt76 开源驱动
          **固件格式**: .itb (FIT image)
          **包管理器**: apk (Alpine Package Keeper)

          ---

          ### ⚠️ 刷机须知
          1. **U-Boot 要求**: 建议使用支持 .itb 格式的 U-Boot (如 hanwckf/bl-mt798x 20241115+)
          2. **首次刷机**: 使用 initramfs-recovery.itb 过渡，再刷 sysupgrade.itb
          3. **升级固件**: 使用 sysupgrade.itb，建议不保留配置升级
          4. **默认地址**: 192.168.1.1 或 192.168.6.1 (immortalwrt.lan)
          5. **默认密码**: 无 (留空)
          6. **注意**: 25.12 使用 apk 包管理器，不再是 opkg

          ---

          ### 内置插件清单
          $PLUGINS

          ---

          ### 特性说明
          - ✅ 官方 ImmortalWrt 25.12 稳定版，持续更新
          - ✅ mt76 开源无线驱动，社区维护
          - ✅ IPv6 支持完善，无已知严重 bug
          - ✅ 软件包管理器: apk (Alpine Package Keeper)
          - ✅ 内核 6.12 LTS，长期支持
          EOF

          echo "notes_file=$PWD/release_notes.txt" >> $GITHUB_OUTPUT

      # ---------- 12. 整理固件文件 ----------
      - name: Organize firmware files
        id: organize
        run: |
          cd openwrt/bin/targets/*/*
          rm -rf packages

          echo "===== 固件文件列表 ====="
          ls -lh *.itb 2>/dev/null || true
          ls -lh *.bin 2>/dev/null || true

          echo "FIRMWARE=$PWD" >> $GITHUB_ENV
          echo "status=success" >> $GITHUB_OUTPUT

      # ---------- 13. 上传 Artifact ----------
      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        if: steps.organize.outputs.status == 'success'
        with:
          name: ImmortalWrt-RAX3000M-NAND-Official-25.12-${{ github.run_number }}
          path: |
            ${{ env.FIRMWARE }}/*.itb
            ${{ env.FIRMWARE }}/*.bin

      # ---------- 14. 发布 Release ----------
      - name: Release to GitHub
        uses: softprops/action-gh-release@v2
        if: steps.organize.outputs.status == 'success' && inputs.release == true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: RAX3000M-NAND-Official-25.12-${{ github.run_number }}
          name: ImmortalWrt-RAX3000M-NAND-Official-25.12-Build-${{ github.run_number }}
          body_path: openwrt/release_notes.txt
          files: |
            ${{ env.FIRMWARE }}/*.itb
            ${{ env.FIRMWARE }}/*.bin
