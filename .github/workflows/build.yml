name: Build ImmortalWrt RAX3000M NAND (Official 25.12 Stable)

on:
  workflow_dispatch:
    inputs:
      release:
        description: '发布到 Release'
        required: true
        default: true
        type: boolean

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: v25.12.1
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Init build environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          docker rmi $(docker images -q) 2>/dev/null || true
          sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo apt update -y
          sudo apt full-upgrade -y
          sudo apt install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler ecj fastjar flex gawk gettext gcc-multilib \
            g++-multilib git gnutls-dev gperf haveged help2man intltool lib32gcc-s1 libc6-dev-i386 libelf-dev \
            libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses-dev libpython3-dev \
            libreadline-dev libssl-dev libtool libyaml-dev libz-dev lld llvm lrzsz mkisofs msmtp nano \
            ninja-build p7zip p7zip-full patch pkgconf python3 python3-pip python3-ply python3-docutils \
            python3-pyelftools qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo uglifyjs \
            upx-ucl unzip vim wget xmlto xxd zlib1g-dev zstd
          sudo apt autoremove --purge -y
          sudo apt clean -y
          sudo timedatectl set-timezone "$TZ"

      - name: Clone source code
        run: |
          git clone --single-branch --filter=blob:none -b $REPO_BRANCH $REPO_URL openwrt
          cd openwrt
          echo "源码分支: $(git branch -a)"
          echo "最新提交: $(git log -1 --pretty=format:'%h %s')"

      - name: DIY Part1 - 快速克隆源码 (Git Clone 模式)
        run: |
          cd openwrt
          
          # 1. MosDNS (替换官方源)
          echo "===== 克隆 MosDNS ====="
          rm -rf ./feeds/packages/net/mosdns ./package/feeds/packages/mosdns
          git clone --depth=1 -b v5 https://github.com/sbwml/luci-app-mosdns.git package/luci-app-mosdns
          
          # 2. Sirpdboy 插件集
          echo "===== 克隆 Sirpdboy 插件 ====="
          git clone --depth=1 https://github.com/sirpdboy/luci-theme-kucat.git package/luci-theme-kucat
          git clone --depth=1 https://github.com/sirpdboy/luci-app-kucat-config.git package/luci-app-kucat-config
          git clone --depth=1 https://github.com/sirpdboy/luci-app-netwizard.git package/luci-app-netwizard
          git clone --depth=1 https://github.com/sirpdboy/luci-app-partexp.git package/luci-app-partexp
          git clone --depth=1 https://github.com/sirpdboy/luci-app-taskplan.git package/luci-app-taskplan
          git clone --depth=1 https://github.com/sirpdboy/luci-app-eqosplus.git package/luci-app-eqosplus
          git clone --depth=1 https://github.com/sirpdboy/luci-app-lucky.git package/luci-app-lucky
          
          # 3. Bandix 插件
          echo "===== 克隆 Bandix ====="
          git clone --depth=1 https://github.com/timsaya/openwrt-bandix.git package/openwrt-bandix
          git clone --depth=1 https://github.com/timsaya/luci-app-bandix.git package/luci-app-bandix
          
          # 4. 第三方 Feeds 源 (改为 Git Clone 模式以加速)
          echo "===== 克隆第三方 Feeds 源 ====="
          # Passwall2
          git clone --depth=1 https://github.com/Openwrt-Passwall/openwrt-passwall2.git package/openwrt-passwall2
          # NAS & DDNSTO
          git clone --depth=1 https://github.com/linkease/nas-packages.git package/nas-packages
          git clone --depth=1 https://github.com/linkease/nas-packages-luci.git package/nas-packages-luci
          # iStore
          git clone --depth=1 https://github.com/linkease/istore.git package/istore
          # Fantastic (可选，如不需要可保持注释)
          # git clone --depth=1 https://github.com/fantastic-packages/fantastic-packages-feeds.git package/fantastic-packages

      - name: 配置 Feeds 源 (仅保留官方源)
        run: |
          cd openwrt
          # 仅保留 ImmortalWrt 官方源以加快更新速度
          # 注意：第三方源已在上面通过 git clone 获取，无需在此配置
          cat > feeds.conf.default <<EOF
          src-git packages https://github.com/immortalwrt/packages.git;openwrt
