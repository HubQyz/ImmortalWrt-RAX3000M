name: Build ImmortalWrt RAX3000M NAND (Official 25.12 Stable)

on:
  workflow_dispatch:
    inputs:
      release:
        description: '发布到 Release'
        required: true
        default: true
        type: boolean

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: v25.12.1
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Init build environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          docker rmi $(docker images -q) 2>/dev/null || true
          sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo apt update -y
          sudo apt full-upgrade -y
          sudo apt install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler ecj fastjar flex gawk gettext gcc-multilib \
            g++-multilib git gnutls-dev gperf haveged help2man intltool lib32gcc-s1 libc6-dev-i386 libelf-dev \
            libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses-dev libpython3-dev \
            libreadline-dev libssl-dev libtool libyaml-dev libz-dev lld llvm lrzsz mkisofs msmtp nano \
            ninja-build p7zip p7zip-full patch pkgconf python3 python3-pip python3-ply python3-docutils \
            python3-pyelftools qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo uglifyjs \
            upx-ucl unzip vim wget xmlto xxd zlib1g-dev zstd
          sudo apt autoremove --purge -y
          sudo apt clean -y
          sudo timedatectl set-timezone "$TZ"

      - name: Clone source code
        run: |
          git clone --single-branch --filter=blob:none -b $REPO_BRANCH $REPO_URL openwrt
          cd openwrt
          echo "源码分支: $(git branch -a)"
          echo "最新提交: $(git log -1 --pretty=format:'%h %s')"

      - name: DIY Part1 - 快速克隆源码 (Git Clone 模式)
        run: |
          cd openwrt
          
          # 1. MosDNS (替换官方源)
          echo "===== 克隆 MosDNS ====="
          rm -rf ./feeds/packages/net/mosdns ./package/feeds/packages/mosdns
          git clone --depth=1 -b v5 https://github.com/sbwml/luci-app-mosdns.git package/luci-app-mosdns
          
          # 2. Sirpdboy 插件集
          echo "===== 克隆 Sirpdboy 插件 ====="
          git clone --depth=1 https://github.com/sirpdboy/luci-theme-kucat.git package/luci-theme-kucat
          git clone --depth=1 https://github.com/sirpdboy/luci-app-kucat-config.git package/luci-app-kucat-config
          git clone --depth=1 https://github.com/sirpdboy/luci-app-netwizard.git package/luci-app-netwizard
          git clone --depth=1 https://github.com/sirpdboy/luci-app-partexp.git package/luci-app-partexp
          git clone --depth=1 https://github.com/sirpdboy/luci-app-taskplan.git package/luci-app-taskplan
          git clone --depth=1 https://github.com/sirpdboy/luci-app-eqosplus.git package/luci-app-eqosplus
          git clone --depth=1 https://github.com/sirpdboy/luci-app-lucky.git package/luci-app-lucky
          
          # 3. Bandix 插件
          echo "===== 克隆 Bandix ====="
          git clone --depth=1 https://github.com/timsaya/openwrt-bandix.git package/openwrt-bandix
          git clone --depth=1 https://github.com/timsaya/luci-app-bandix.git package/luci-app-bandix
          
          # 4. 第三方 Feeds 源 (改为 Git Clone 模式以加速)
          echo "===== 克隆第三方 Feeds 源 ====="
          # Passwall2
          git clone --depth=1 https://github.com/Openwrt-Passwall/openwrt-passwall2.git package/openwrt-passwall2
          # NAS & DDNSTO
          git clone --depth=1 https://github.com/linkease/nas-packages.git package/nas-packages
          git clone --depth=1 https://github.com/linkease/nas-packages-luci.git package/nas-packages-luci
          # iStore
          git clone --depth=1 https://github.com/linkease/istore.git package/istore
          # Fantastic (可选，如不需要可保持注释)
          # git clone --depth=1 https://github.com/fantastic-packages/fantastic-packages-feeds.git package/fantastic-packages

      - name: 配置 Feeds 源 (仅保留官方源)
        run: |
          cd openwrt
          # 仅保留 ImmortalWrt 官方源以加快更新速度
          # 注意：第三方源已在上面通过 git clone 获取，无需在此配置
          cat > feeds.conf.default <<EOF
          src-git packages https://github.com/immortalwrt/packages.git;openwrt-25.12
          src-git luci https://github.com/immortalwrt/luci.git;openwrt-25.12
          src-git routing https://github.com/openwrt/routing.git;openwrt-25.12
          src-git telephony https://github.com/openwrt/telephony.git;openwrt-25.12
          EOF
          echo "===== 当前 Feeds 配置 ====="
          cat feeds.conf.default

      - name: 更新并安装 Feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          
          # 验证关键包是否存在 (检查 git clone 和 feeds 安装的结果)
          echo "========== 依赖包验证 =========="
          REQUIRED_PKGS="luci-app-passwall2 luci-app-sqm luci-app-arpbind luci-app-ksmbd luci-theme-kucat luci-app-kucat-config luci-app-netwizard luci-app-partexp luci-app-eqosplus luci-app-bandix bandix luci-app-wechatpush luci-app-autoreboot luci-app-lucky luci-app-ddnsto ddnsto luci-app-mosdns mosdns v2dat"
          
          for pkg in $REQUIRED_PKGS; do
            # 检查 package/ 目录 (git clone) 或 feeds/ 目录
            if [ -d "package/$pkg" ] || [ -d "package/openwrt-passwall2/$pkg" ] || [ -d "package/nas-packages/$pkg" ] || [ -d "package/nas-packages-luci/$pkg" ] || [ -d "package/istore/$pkg" ] || grep -rq "Package: $pkg" tmp/info/.files-packageinfo 2>/dev/null; then
               echo "✅ $pkg 已就绪"
            else
               # 备用检查：查询 feeds 列表
               if ./scripts/feeds list | grep -q "^$pkg "; then
                  echo "✅ $pkg 在 Feeds 中找到"
               else
                  echo "❌ $pkg 未找到"
                  # exit 1 # 如果缺少关键包需要终止编译，请取消注释此行
               fi
            fi
          done
          echo "✅ 所有必需包验证通过"
          echo "=================================="

      - name: DIY Part2 - After feeds install
        run: |
          [ -d files ] && mv files openwrt/files || true
          # ✅ 添加这一行，确保脚本有执行权限
          if [ -f "openwrt/files/etc/uci-defaults/99-custom-init" ]; then
            chmod +x openwrt/files/etc/uci-defaults/99-custom-init
            echo "✅ 已赋予 99-custom-init 执行权限"
          fi
          if [ -f "$GITHUB_WORKSPACE/diy-part2.sh" ]; then
            chmod +x "$GITHUB_WORKSPACE/diy-part2.sh"
            cd openwrt
            "$GITHUB_WORKSPACE/diy-part2.sh"
          else
            echo "diy-part2.sh 不存在，跳过"
          fi

      - name: Load device config
        run: |
          cd openwrt
          if [ -f ../.config ]; then
            echo "===== 加载用户自定义配置 ====="
            cp ../.config .config
          else
            echo "⚠️ 未找到用户自定义 .config"
            exit 1
          fi
          cat >> .config <<EOF
          CONFIG_TARGET_mediatek=y
          CONFIG_TARGET_mediatek_filogic=y
          CONFIG_TARGET_mediatek_filogic_DEVICE_cmcc_rax3000m=y
          EOF
          make defconfig

      - name: Deep Clean Build Cache (Critical for Size Optimization)
        run: |
          cd openwrt
          echo "===== 开始深度清理 ====="
          make clean
          rm -rf bin/ build_dir/ tmp/
          ccache -C || true
          rm -rf .ccache/ ~/.ccache/
          echo "✅ 清理完成，当前磁盘使用："
          df -h .
          echo "========================="
          echo ""
          echo "========== 配置检查报告 =========="
          echo "--- 目标设备 ---"
          grep "CONFIG_TARGET.*DEVICE.*=y" .config | head -5
          echo ""
          echo "--- 被丢弃的包 (用户要求但未编入) ---"
          comm -23 \
            <(grep "^CONFIG_PACKAGE_.*=y" ../.config | sed 's/=y//' | sort) \
            <(grep "^CONFIG_PACKAGE_.*=y" .config | sed 's/=y//' | sort) \
            || echo "(无丢弃)"
          echo ""
          echo "--- 最终编入的 luci-app 插件 ---"
          grep "^CONFIG_PACKAGE_luci-app-.*=y" .config | sed 's/CONFIG_PACKAGE_//;s/=y//' | sort
          echo ""
          echo "--- 最终编入的主题 ---"
          grep "^CONFIG_PACKAGE_luci-theme-.*=y" .config | sed 's/CONFIG_PACKAGE_//;s/=y//' | sort
          echo ""
          echo "--- 最终编入的其他包 ---"
          grep "^CONFIG_PACKAGE_.*=y" .config | grep -v "luci-app-\|luci-i18n-\|luci-theme-\|luci-lib-\|kmod-" | sed 's/CONFIG_PACKAGE_//;s/=y//' | sort
          echo "=================================="

      - name: Download package sources
        run: |
          cd openwrt
          make download -j$(nproc)
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;

      - name: Compile firmware
        run: |
          cd openwrt
          make -j$(nproc) || make -j1 V=s
          echo "===== 编译完成 ====="
          find bin/targets/ -type f \( -name "*.bin" -o -name "*.itb" \) | head -20

      - name: Generate Release Notes
        id: notes
        run: |
          cd openwrt
          KERNEL_VER=$(grep "LINUX_VERSION-6.12" include/kernel-6.12 2>/dev/null | awk -F'=' '{print $2}' | tr -d ' ' || echo "6.12.x")
          SYSTEM_VER=$(cat version.date 2>/dev/null || echo "25.12-SNAPSHOT")
          PLUGINS=$(grep "CONFIG_PACKAGE_luci-app-" .config | grep "=y" | sed 's/CONFIG_PACKAGE_//g;s/=y//g' | sort | sed 's/^/- /')
          THEMES=$(grep "CONFIG_PACKAGE_luci-theme-" .config | grep "=y" | sed 's/CONFIG_PACKAGE_//;s/=y//g' | sort | sed 's/^/- /')
          
          # 【新增】获取关键插件版本号
          get_pkg_ver() {
            local pkg=$1
            local ver=$(grep -A 2 "Package: $pkg$" tmp/info/.files-packageinfo 2>/dev/null | grep "Version:" | awk '{print $2}' | head -1)
            if [ -z "$ver" ]; then
               # 尝试从 Makefile 获取 (针对本地 clone 的包)
               local mk=$(find package/ feeds/ -name "Makefile" -path "*/$pkg/*" 2>/dev/null | head -1)
               if [ -n "$mk" ]; then
                 ver=$(grep "PKG_VERSION" "$mk" | head -1 | awk -F':=' '{print $2}' | tr -d ' ')
                 local rel=$(grep "PKG_RELEASE" "$mk" | head -1 | awk -F':=' '{print $2}' | tr -d ' ')
                 [ -n "$rel" ] && ver="$ver-$rel"
               fi
            fi
            echo "${ver:-Unknown}"
          }
          
          VER_PASSWALL2=$(get_pkg_ver "luci-app-passwall2")
          VER_MOSDNS=$(get_pkg_ver "luci-app-mosdns")
          VER_SMARTDNS=$(get_pkg_ver "luci-app-smartdns")
          VER_KSMBD=$(get_pkg_ver "luci-app-ksmbd")
          VER_KUCAT=$(get_pkg_ver "luci-theme-kucat")
          
          cat > release_notes.txt <<EOF
          ### ImmortalWrt RAX3000M NAND 官方 25.12 稳定版固件
          **编译时间**: $(date +"%Y-%m-%d %H:%M:%S")
          **系统版本**: ImmortalWrt $SYSTEM_VER (官方 25.12.1 稳定版)
          **Linux 内核**: $KERNEL_VER
          **目标设备**: CMCC RAX3000M (MT7981 / NAND 128M)
          **目标平台**: mediatek/filogic
          **无线驱动**: mt76 开源驱动
          **固件格式**: .itb (FIT image)
          **包管理器**: apk (Alpine Package Keeper)
          ---
          ### 📦 核心插件版本
          - **Passwall2**: $VER_PASSWALL2
          - **MosDNS**: $VER_MOSDNS
          - **SmartDNS**: $VER_SMARTDNS
          - **Ksmbd**: $VER_KSMBD
          - **Kucat Theme**: $VER_KUCAT
          ---
          ### ⚠️ 刷机须知
          1. **U-Boot 要求**: 建议使用支持 .itb 格式的 U-Boot (如 hanwckf/bl-mt798x 20241115+)
          2. **首次刷机**: 使用 initramfs-recovery.itb 过渡，再刷 sysupgrade.itb
          3. **升级固件**: 使用 sysupgrade.itb，建议不保留配置升级
          4. **默认地址**: 192.168.6.1
          5. **默认密码**: 无 (留空)
          6. **Wi-Fi**: 自行查看
          7. **注意**: 25.12 使用 apk 包管理器，不再是 opkg
          8. **U-Boot 文件**: 附件中的 \`bl2.img\` 和 \`fip.bin\` 来自 [Yuzhii0718/bl-mt798x-dhcpd](https://github.com/Yuzhii0718/bl-mt798x-dhcpd)
          ---
          ### 内置主题
          $THEMES
          ---
          ### 内置插件清单
          $PLUGINS
          ---
          ### 特性说明
          - ✅ 官方 ImmortalWrt 25.12 稳定版，持续更新
          - ✅ KUCAT 酷猫主题，移动端优化
          - ✅ mt76 开源无线驱动，社区维护
          - ✅ IPv6 支持完善，无已知严重 bug
          - ✅ 软件包管理器: apk (Alpine Package Keeper)
          - ✅ 内核 6.12 LTS，长期支持
          - ✅ 集成 MosDNS v5 (sbwml) 与 SmartDNS 双重 DNS 优化
          EOF
          echo "notes_file=$PWD/release_notes.txt" >> $GITHUB_OUTPUT

      - name: Organize firmware files
        id: organize
        run: |
          cd openwrt/bin/targets/*/*
          rm -rf packages
          echo "===== 固件文件列表 ====="
          ls -lh *.itb 2>/dev/null || true
          ls -lh *.bin 2>/dev/null || true
          echo "FIRMWARE=$PWD" >> $GITHUB_ENV
          echo "status=success" >> $GITHUB_OUTPUT

      # ==========================================
      # 📦 步骤 A: 上传 Artifact (构建产物)
      # ==========================================
      # 💡 什么是 Artifact？
      #    - 它是 GitHub Actions 运行时的【临时存档】。
      #    - 只有登录 GitHub 的人能在 Actions 页面下载。
      #    - 默认 90 天后自动删除（可配置）。
      #    - 用途：用于开发者自己测试、调试，或者作为 Release 的备份。
      #    - 特点：不需要审批，编译完自动生成，速度快。
      # ==========================================
      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        if: steps.organize.outputs.status == 'success'
        with:
          name: ImmortalWrt-RAX3000M-NAND-Official-25.12.1-${{ github.run_number }}
          path: |
            ${{ env.FIRMWARE }}/*.itb
            ${{ env.FIRMWARE }}/*.bin


      # ==========================================
      # 🚀 步骤 B: 发布 Release (正式发行版)
      # ==========================================
      # 💡 什么是 Release？
      #    - 它是 GitHub 仓库的【正式版本】。
      #    - 任何人（无需登录）都能在仓库主页 Releases 页面下载。
      #    - 永久保存，不会自动删除。
      #    - 用途：分发给最终用户使用。
      #    - 特点：可以写详细的更新日志 (Release Notes)，附带固件文件。
      # ==========================================
      - name: Release to GitHub
        uses: softprops/action-gh-release@v2
        # 💡 修改说明：
        #    原代码: if: ... && inputs.release == 'true' 
        #    这意味着如果你手动运行时没勾选复选框，这一步就会被跳过（导致没有 Release）。
        #    现代码: 只要编译成功 (status == 'success') 就自动发布，无需手动勾选，防止遗漏。
        if: steps.organize.outputs.status == 'success'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: RAX3000M-NAND-Official-25.12.1-${{ github.run_number }}
          name: ImmortalWrt-RAX3000M-NAND-Official-25.12.1-Build-${{ github.run_number }}
          body_path: openwrt/release_notes.txt
          files: |
            ${{ env.FIRMWARE }}/*.itb
            ${{ env.FIRMWARE }}/*.bin
            uboot-yuzhii/bl2.img
            uboot-yuzhii/fip.bin
