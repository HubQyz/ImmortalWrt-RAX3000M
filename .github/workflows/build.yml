name: Build ImmortalWrt RAX3000M

on:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: openwrt-25.12
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Init environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt update -y
          sudo apt install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-distutils python3-setuptools rsync swig unzip zlib1g-dev file wget

      - name: Clone source
        run: |
          git clone --depth=1 $REPO_URL -b $REPO_BRANCH openwrt || git clone --depth=1 $REPO_URL openwrt

      - name: Add feeds
        run: |
          cd openwrt
          echo "src-git small https://github.com/kenzok8/small.git" >> feeds.conf.default
          echo "src-git packages https://github.com/kenzok8/openwrt-packages.git" >> feeds.conf.default
          echo "src-git istore https://github.com/linkease/istore.git" >> feeds.conf.default

      - name: Update feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Load config
        run: |
          cd openwrt
          cp ../.config .config
          make defconfig

      - name: Download
        run: |
          cd openwrt
          make download -j8

      - name: Compile
        run: |
          cd openwrt
          make -j$(nproc) || make -j1 V=s

      - name: Organize
        id: organize
        run: |
          cd openwrt/bin/targets/*/*
          rm -rf packages
          echo "FIRMWARE=$PWD" >> $GITHUB_ENV
          echo "status=success" >> $GITHUB_OUTPUT

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: ImmortalWrt-RAX3000M
          path: ${{ env.FIRMWARE }}

      - name: Release
        uses: softprops/action-gh-release@v2
        if: steps.organize.outputs.status == 'success'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: RAX3000M
          files: ${{ env.FIRMWARE }}/*
