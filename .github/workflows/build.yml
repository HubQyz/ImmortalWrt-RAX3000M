name: Build ImmortalWrt RAX3000M NAND (Official 25.12 Stable)

on:
  workflow_dispatch:
    inputs:
      release:
        description: '发布到 Release (建议始终勾选)'
        required: true
        default: true
        type: boolean

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: v25.12.1
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 检出代码 (Checkout)
        uses: actions/checkout@v7

      - name: 初始化编译环境 (Init Environment)
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # 清理 Docker 镜像和预装软件以释放空间
          docker rmi $(docker images -q) 2>/dev/null || true
          sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          # 更新软件源并安装编译依赖
          sudo apt update -y
          sudo apt full-upgrade -y
          sudo apt install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
          bzip2 ccache clang cmake cpio curl device-tree-compiler ecj fastjar flex gawk gettext gcc-multilib \
          g++-multilib git gnutls-dev gperf haveged help2man intltool lib32gcc-s1 libc6-dev-i386 libelf-dev \
          libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses-dev libpython3-dev \
          libreadline-dev libssl-dev libtool libyaml-dev libz-dev lld llvm lrzsz mkisofs msmtp nano \
          ninja-build p7zip p7zip-full patch pkgconf python3 python3-pip python3-ply python3-docutils \
          python3-pyelftools qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo uglifyjs \
          upx-ucl unzip vim wget xmlto xxd zlib1g-dev zstd
          sudo apt autoremove --purge -y
          sudo apt clean -y
          sudo timedatectl set-timezone "$TZ"

      - name: 克隆 ImmortalWrt 源码 (Clone Source)
        run: |
          # 使用 blob:none 过滤以减少克隆体积和时间
          git clone --single-branch --filter=blob:none -b $REPO_BRANCH $REPO_URL openwrt
          cd openwrt
          echo "源码分支: $(git branch -a)"
          echo "最新提交: $(git log -1 --pretty=format:'%h %s')"

      - name: DIY Part1 - 快速克隆插件与源 (Fast Clone Plugins)
        run: |
          cd openwrt
          # 1. MosDNS (替换官方旧版)
          echo "===== 克隆 MosDNS ====="
          rm -rf ./feeds/packages/net/mosdns ./package/feeds/packages/mosdns
          git clone --depth=1 -b v5 https://github.com/sbwml/luci-app-mosdns.git package/luci-app-mosdns
          # 2. Sirpdboy 插件集 (主题、向导、扩容等)
          echo "===== 克隆 Sirpdboy 插件 ====="
          git clone --depth=1 https://github.com/sirpdboy/luci-theme-kucat.git package/luci-theme-kucat
          git clone --depth=1 https://github.com/sirpdboy/luci-app-kucat-config.git package/luci-app-kucat-config
          git clone --depth=1 https://github.com/sirpdboy/luci-app-netwizard.git package/luci-app-netwizard
          git clone --depth=1 https://github.com/sirpdboy/luci-app-partexp.git package/luci-app-partexp
          git clone --depth=1 https://github.com/sirpdboy/luci-app-taskplan.git package/luci-app-taskplan
          git clone --depth=1 https://github.com/sirpdboy/luci-app-eqosplus.git package/luci-app-eqosplus
          git clone --depth=1 https://github.com/sirpdboy/luci-app-lucky.git package/luci-app-lucky
          # 3. Bandix 带宽监控插件
          echo "===== 克隆 Bandix ====="
          git clone --depth=1 https://github.com/timsaya/openwrt-bandix.git package/openwrt-bandix
          git clone --depth=1 https://github.com/timsaya/luci-app-bandix.git package/luci-app-bandix
          # 4. 第三方 Feeds 源 (改为 Git Clone 模式以加速)
          # 【已移除 passwall2】科学上网改用官方自带的 HomeProxy，无需第三方源
          echo "===== 克隆第三方 Feeds 源 ====="
          git clone --depth=1 https://github.com/linkease/nas-packages.git package/nas-packages
          git clone --depth=1 https://github.com/linkease/nas-packages-luci.git package/nas-packages-luci
          git clone --depth=1 https://github.com/linkease/istore.git package/istore

      - name: 配置 Feeds 源 (Configure Feeds)
        run: |
          cd openwrt
          # 仅保留 ImmortalWrt 官方核心源，第三方源已在上面通过 git clone 获取
          cat > feeds.conf.default <<EOF
          src-git packages https://github.com/immortalwrt/packages.git;openwrt-25.12
          src-git luci https://github.com/immortalwrt/luci.git;openwrt-25.12
          src-git routing https://github.com/openwrt/routing.git;openwrt-25.12
          src-git telephony https://github.com/openwrt/telephony.git;openwrt-25.12
          EOF
          echo "===== 当前 Feeds 配置 ====="
          cat feeds.conf.default

      - name: 更新并安装 Feeds (Update & Install Feeds)
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          # 验证关键包是否存在
          echo "========== 依赖包验证 =========="
          REQUIRED_PKGS="luci-app-homeproxy adblock-fast luci-app-adblock-fast luci-i18n-adblock-fast-zh-cn gawk grep sed coreutils-sort luci-app-sqm luci-app-arpbind luci-app-ksmbd luci-theme-kucat luci-app-kucat-config luci-app-netwizard luci-app-partexp luci-app-eqosplus luci-app-bandix bandix luci-app-wechatpush luci-app-autoreboot luci-app-lucky luci-app-ddnsto ddnsto luci-app-mosdns mosdns v2dat"
          ./scripts/feeds list > /tmp/feeds-list.txt 2>/dev/null || true
          for pkg in $REQUIRED_PKGS; do
            if [ -n "$(find package -maxdepth 3 -type d -name "$pkg" 2>/dev/null | head -n 1)" ] || grep -rq "Package: $pkg" tmp/info/.files-packageinfo 2>/dev/null; then
              echo "✅ $pkg 已就绪"
            else
              if grep -q "^$pkg " /tmp/feeds-list.txt 2>/dev/null; then
                echo "✅ $pkg 在 Feeds 中找到"
              else
                echo "❌ $pkg 未找到"
              fi
            fi
          done
          echo "✅ 所有必需包验证通过"

      - name: DIY Part2 - 加载自定义文件 (Load Custom Files)
        run: |
          # 将仓库根目录的 files 文件夹移动到编译目录，用于覆盖默认配置
          [ -d files ] && mv files openwrt/files || true
          # 确保自定义脚本有执行权限
          if [ -f "openwrt/files/etc/uci-defaults/99-custom-init" ]; then
            chmod +x openwrt/files/etc/uci-defaults/99-custom-init
            echo "✅ 已赋予 99-custom-init 执行权限"
          fi
          # 执行用户自定义脚本 (如果存在)
          if [ -f "$GITHUB_WORKSPACE/diy-part2.sh" ]; then
            chmod +x "$GITHUB_WORKSPACE/diy-part2.sh"
            cd openwrt
            "$GITHUB_WORKSPACE/diy-part2.sh"
          else
            echo "diy-part2.sh 不存在，跳过"
          fi

      - name: 加载设备配置 (Load Device Config)
        run: |
          cd openwrt
          if [ -f ../.config ]; then
            echo "===== 加载用户自定义配置 ====="
            cp ../.config .config
          else
            echo "⚠️ 未找到用户自定义 .config"
            exit 1
          fi
          # 强制指定目标设备为 RAX3000M
          cat >> .config <<EOF
          CONFIG_TARGET_mediatek=y
          CONFIG_TARGET_mediatek_filogic=y
          CONFIG_TARGET_mediatek_filogic_DEVICE_cmcc_rax3000m=y
          EOF
          make defconfig
          # ★ 备份包索引：索引在 defconfig 后才生成（上次错在 Feeds 阶段就 cp）；if 保护，缺失只警告不报错
          if [ -f tmp/info/.files-packageinfo ]; then
            cp tmp/info/.files-packageinfo "$GITHUB_WORKSPACE/.files-packageinfo"
            echo "✅ 包索引已备份"
          else
            echo "⚠️ 包索引未生成，跳过备份（不影响编译）"
          fi

      - name: 深度清理缓存 (Deep Clean)
        run: |
          cd openwrt
          echo "===== 开始深度清理 ====="
          make clean
          rm -rf bin/ build_dir/ tmp/
          ccache -C || true
          rm -rf .ccache/ ~/.ccache/
          echo "✅ 清理完成，当前磁盘使用："
          df -h .

      - name: 下载编译源码 (Download Sources)
        run: |
          cd openwrt
          make download -j$(nproc)
          # 清理小于 1KB 的损坏下载文件
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;

      - name: 编译固件 (Compile Firmware)
        run: |
          cd openwrt
          # 多线程编译，失败后尝试单线程调试
          make -j$(nproc) || make -j1 V=s
          echo "===== 编译完成 ====="
          find bin/targets/ -type f \( -name "*.bin" -o -name "*.itb" \) | head -20

      - name: 生成发布说明 (Generate Release Notes)
        id: notes
        run: |
          cd openwrt
          # ★ 还原包索引：Deep Clean 删了 tmp/，写说明前还原；if 保护，缺失只警告不报错
          mkdir -p tmp/info
          if [ -f "$GITHUB_WORKSPACE/.files-packageinfo" ]; then
            cp "$GITHUB_WORKSPACE/.files-packageinfo" tmp/info/.files-packageinfo
            echo "✅ 包索引已还原"
          fi
          KERNEL_VER=$(grep "LINUX_VERSION-6.12" include/kernel-6.12 2>/dev/null | awk -F'=' '{print $2}' | tr -d ' ' || echo "6.12.x")
          SYSTEM_VER=$(cat version.date 2>/dev/null || echo "25.12-SNAPSHOT")
          # 过滤掉不需要的插件 (如 rclone 等)
          PLUGINS=$(grep "CONFIG_PACKAGE_luci-app-" .config | grep "=y" | grep -v "rclone" | sed 's/CONFIG_PACKAGE_//g;s/=y//g' | sort | sed 's/^/- /')
          THEMES=$(grep "CONFIG_PACKAGE_luci-theme-" .config | grep "=y" | sed 's/CONFIG_PACKAGE_//;s/=y//g' | sort | sed 's/^/- /')
          # ── 通用函数 ──────────────────────────────────────────
          get_pkg_ver() {
            local pkg=$1
            local ver=$(grep -A 2 "Package: $pkg$" tmp/info/.files-packageinfo 2>/dev/null \
              | grep "Version:" | awk '{print $2}' | head -1)
            if [ -z "$ver" ]; then
              local mk=$(find package/ feeds/ -name "Makefile" -path "*/$pkg/*" 2>/dev/null | head -1)
              if [ -n "$mk" ]; then
                ver=$(grep "PKG_VERSION" "$mk" | head -1 | awk -F':=' '{print $2}' | tr -d ' ')
                local rel=$(grep "PKG_RELEASE" "$mk" | head -1 | awk -F':=' '{print $2}' | tr -d ' ')
                [ -n "$rel" ] && ver="$ver-$rel"
              fi
            fi
            echo "${ver:-Unknown}"
          }
          # ── MosDNS 本体 ───────────────────────────────────────
          get_mosdns_core_ver() {
            local ver=""
            local mk=$(find feeds/ package/ -type f -path "*/mosdns/Makefile" 2>/dev/null \
              | grep -v "luci-app-mosdns" | head -1)
            if [ -n "$mk" ]; then
              ver=$(grep "PKG_VERSION" "$mk" | head -1 | awk -F':=' '{print $2}' | tr -d ' ')
              local rel=$(grep "PKG_RELEASE" "$mk" | head -1 | awk -F':=' '{print $2}' | tr -d ' ')
              [ -n "$rel" ] && ver="${ver}-${rel}"
            fi
            echo "${ver:-Unknown}"
          }
          # ── SmartDNS 本体 ─────────────────────────────────────
          get_smartdns_core_ver() {
            local ver=""
            local mk=$(find feeds/ package/ -type f -path "*/smartdns/Makefile" 2>/dev/null \
              | grep -v "luci-app-smartdns" | head -1)
            if [ -n "$mk" ]; then
              ver=$(grep "PKG_VERSION" "$mk" | head -1 | awk -F':=' '{print $2}' | tr -d ' ')
              local rel=$(grep "PKG_RELEASE" "$mk" | head -1 | awk -F':=' '{print $2}' | tr -d ' ')
              [ -n "$rel" ] && ver="${ver}-${rel}"
            fi
            echo "${ver:-Unknown}"
          }
          # ── 赋值（【本次】ksmbd 改用通用函数，get_ksmbd_ver 已删除）──
          VER_HOMEPROXY=$(get_pkg_ver "luci-app-homeproxy")
          VER_ADBLOCK_FAST=$(get_pkg_ver "adblock-fast")
          VER_ADBLOCK_LUCI=$(get_pkg_ver "luci-app-adblock-fast")
          VER_MOSDNS_LUCI=$(get_pkg_ver "luci-app-mosdns")
          VER_MOSDNS_CORE=$(get_mosdns_core_ver)
          VER_SMARTDNS_LUCI=$(get_pkg_ver "luci-app-smartdns")
          VER_SMARTDNS_CORE=$(get_smartdns_core_ver)
          VER_KSMBD=$(get_pkg_ver "luci-app-ksmbd")
          VER_KUCAT=$(get_pkg_ver "luci-theme-kucat")
          cat > release_notes.txt <<EOF
          ### ImmortalWrt RAX3000M NAND 官方 25.12 稳定版固件
          **编译时间**: $(date +"%Y-%m-%d %H:%M:%S")
          **系统版本**: ImmortalWrt $SYSTEM_VER (官方 25.12.1 稳定版)
          **Linux 内核**: $KERNEL_VER
          **目标设备**: CMCC RAX3000M (MT7981 / NAND 128M)
          **目标平台**: mediatek/filogic
          **无线驱动**: mt76 开源驱动
          **固件格式**: .itb (FIT image)
          **包管理器**: apk (Alpine Package Keeper)
          ---
          ### 📦 核心插件版本
          - **HomeProxy**: $VER_HOMEPROXY
          - **AdBlock-Fast**: $VER_ADBLOCK_FAST (LuCI: $VER_ADBLOCK_LUCI)
          - **MosDNS**: $VER_MOSDNS_CORE (LuCI: $VER_MOSDNS_LUCI)
          - **SmartDNS**: $VER_SMARTDNS_CORE (LuCI: $VER_SMARTDNS_LUCI)
          - **Ksmbd**: $VER_KSMBD
          - **Kucat Theme**: $VER_KUCAT
          ---
          ### ⚠️ 刷机须知
          1. **U-Boot 要求**: 建议使用支持 .itb 格式的 U-Boot (如 hanwckf/bl-mt798x 20241115+)
          2. **首次刷机**: 使用 initramfs-recovery.itb 过渡，再刷 sysupgrade.itb
          3. **升级固件**: 使用 sysupgrade.itb，建议不保留配置升级
          4. **默认地址**: 192.168.6.1
          5. **默认密码**: 无 (留空)
          6. **Wi-Fi**: 请刷机后在后台查看或自行设置
          7. **注意**: 25.12 使用 apk 包管理器，不再是 opkg
          8. **U-Boot 文件**: 附件中的 \`bl2.img\` 和 \`fip.bin\` 来自 [Yuzhii0718/bl-mt798x-dhcpd](https://github.com/Yuzhii0718/bl-mt798x-dhcpd)
          ---
          ### 内置主题
          $THEMES
          ---
          ### 内置插件清单
          $PLUGINS
          ---
          ### 特性说明
          - ✅ 官方 ImmortalWrt 25.12 稳定版，持续更新
          - ✅ KUCAT 酷猫主题，移动端优化
          - ✅ mt76 开源无线驱动，社区维护
          - ✅ IPv6 支持完善，无已知严重 bug
          - ✅ 软件包管理器: apk (Alpine Package Keeper)
          - ✅ 内核 6.12 LTS，长期支持
          - ✅ 科学上网: HomeProxy (官方自带，基于 Sing-box)
          - ✅ 集成 AdBlock-Fast 高性能 DNS 广告拦截 (含 GNU 加速工具包)
          - ✅ 集成 MosDNS v5 (sbwml) 与 SmartDNS 双重 DNS 优化
          EOF
          echo "notes_file=$PWD/release_notes.txt" >> $GITHUB_OUTPUT

      - name: 整理固件文件 (Organize Files)
        id: organize
        run: |
          cd openwrt/bin/targets/*/*
          rm -rf packages
          echo "===== 固件文件列表 ====="
          ls -lh *.itb 2>/dev/null || true
          ls -lh *.bin 2>/dev/null || true
          echo "FIRMWARE=$PWD" >> $GITHUB_ENV
          echo "status=success" >> $GITHUB_OUTPUT

      - name: 上传 Artifact (Upload Artifact)
        uses: actions/upload-artifact@v7
        if: steps.organize.outputs.status == 'success'
        with:
          name: ImmortalWrt-RAX3000M-NAND-Official-25.12.1-${{ github.run_number }}
          path: |
            ${{ env.FIRMWARE }}/*.itb
            ${{ env.FIRMWARE }}/*.bin

      - name: 发布 Release (Publish Release)
        uses: softprops/action-gh-release@v3
        if: steps.organize.outputs.status == 'success'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: RAX3000M-NAND-Official-25.12.1-${{ github.run_number }}
          name: ImmortalWrt-RAX3000M-NAND-Official-25.12.1-Build-${{ github.run_number }}
          body_path: openwrt/release_notes.txt
          files: |
            ${{ env.FIRMWARE }}/*.itb
            ${{ env.FIRMWARE }}/*.bin
            uboot-yuzhii/bl2.img
            uboot-yuzhii/fip.bin
