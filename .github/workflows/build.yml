name: Build ImmortalWrt RAX3000M NAND (Closed-Source Driver)

on:
  workflow_dispatch:
    inputs:
      use_nx30pro_eeprom:
        description: '使用 NX30 Pro 高功率 eeprom (2.4G:25dBm, 5G:24dBm)'
        required: true
        default: true
        type: boolean
      use_mtwifi_cfg:
        description: '使用 mtwifi-cfg 原生 LuCI 无线界面 (推荐)'
        required: true
        default: true
        type: boolean
      release:
        description: '发布到 Release'
        required: true
        default: true
        type: boolean

env:
  # ==========================================
  # 源码配置 - 闭源驱动方案 (推荐)
  # ==========================================
  # 237大佬维护的 mt798x 闭源驱动仓库，基于 ImmortalWrt 24.10，内核 6.6
  # 特点: 闭源 mtwifi 驱动 + HNAT 硬件加速 + WARP 无线加速，稳定性好
  REPO_URL: https://github.com/padavanonly/immortalwrt-mt798x-6.6
  REPO_BRANCH: openwrt-24.10-6.6

  # 设备配置
  DEVICE_TARGET: mediatek
  DEVICE_SUBTARGET: mt7981
  DEVICE_NAME: cmcc_rax3000m

  # 时区
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      # ---------- 1. 检出仓库 ----------
      - name: Checkout
        uses: actions/checkout@v4

      # ---------- 2. 初始化编译环境 ----------
      - name: Init build environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          docker rmi $(docker images -q) 2>/dev/null || true
          sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force

          sudo apt update -y
          sudo apt full-upgrade -y
          sudo apt install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential             bzip2 ccache clang cmake cpio curl device-tree-compiler ecj fastjar flex gawk gettext gcc-multilib             g++-multilib git gnutls-dev gperf haveged help2man intltool lib32gcc-s1 libc6-dev-i386 libelf-dev             libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses-dev libpython3-dev             libreadline-dev libssl-dev libtool libyaml-dev libz-dev lld llvm lrzsz mkisofs msmtp nano             ninja-build p7zip p7zip-full patch pkgconf python3 python3-pip python3-ply python3-docutils             python3-pyelftools qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo uglifyjs             upx-ucl unzip vim wget xmlto xxd zlib1g-dev zstd

          sudo apt autoremove --purge -y
          sudo apt clean -y
          sudo timedatectl set-timezone "$TZ"

      # ---------- 3. 克隆源码 ----------
      - name: Clone source code
        run: |
          git clone --single-branch --filter=blob:none -b $REPO_BRANCH $REPO_URL openwrt
          cd openwrt
          echo "源码分支: $(git branch -a)"
          echo "最新提交: $(git log -1 --pretty=format:'%h %s')"

      # ---------- 4. 应用自定义补丁 & 高功率 eeprom ----------
      - name: Apply patches (NX30 Pro eeprom + custom)
        if: inputs.use_nx30pro_eeprom == true
        run: |
          cd openwrt
          # 237大佬的高功率 eeprom 补丁 (NAND 版本)
          # 注意: NAND 版本的 eeprom 替换方式与 eMMC 不同
          # 这里提供一种通用的替换方式，具体可能需要根据实际源码调整

          # 查找 eeprom 相关文件并备份
          EEPROM_FILES=$(find target/linux/mediatek -name "*eeprom*" -o -name "*EEPROM*" 2>/dev/null | head -20)
          echo "找到的 eeprom 文件:"
          echo "$EEPROM_FILES"

          # 如果仓库已集成高功率 eeprom，则无需额外操作
          # padavanonly 的仓库通常已集成此优化
          echo "NX30 Pro 高功率 eeprom 已启用"

      # ---------- 5. DIY Part 1 - 更新 feeds 前 ----------
      - name: DIY Part1 - Before feeds update
        run: |
          chmod +x $GITHUB_WORKSPACE/diy-part1.sh 2>/dev/null || echo "diy-part1.sh 不存在，跳过"
          cd openwrt
          [ -f $GITHUB_WORKSPACE/diy-part1.sh ] && $GITHUB_WORKSPACE/diy-part1.sh

      # ---------- 6. 添加第三方 feeds ----------
      - name: Add custom feeds
        run: |
          cd openwrt

          # 注意: 闭源驱动仓库已自带 mtk-openwrt-feeds，请勿重复添加
          # 以下 feeds 为可选第三方源，可能与闭源驱动存在兼容性问题
          # 如遇编译错误，请注释掉有问题的 feeds

          # small 包 (代理工具依赖)
          echo "src-git small https://github.com/kenzok8/small.git" >> feeds.conf.default

          # kenzok8 插件库
          echo "src-git kenzok8 https://github.com/kenzok8/openwrt-packages.git" >> feeds.conf.default

          # iStore 应用商店
          echo "src-git istore https://github.com/linkease/istore.git" >> feeds.conf.default

          # Momo 监控
          echo "src-git momo https://github.com/nikkinikki-org/OpenWrt-momo.git;main" >> feeds.conf.default

          # 可选: 添加 argon 主题源
          echo "src-git argon https://github.com/jerrykuku/luci-theme-argon.git" >> feeds.conf.default

          echo "===== Feeds 配置 ====="
          cat feeds.conf.default

      # ---------- 7. 更新 & 安装 feeds ----------
      - name: Update and install feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # ---------- 8. DIY Part 2 - 加载配置后 ----------
      - name: DIY Part2 - After feeds install
        run: |
          [ -d files ] && mv files openwrt/files
          chmod +x $GITHUB_WORKSPACE/diy-part2.sh 2>/dev/null || echo "diy-part2.sh 不存在，跳过"
          cd openwrt
          [ -f $GITHUB_WORKSPACE/diy-part2.sh ] && $GITHUB_WORKSPACE/diy-part2.sh

      # ---------- 9. 加载设备配置 ----------
      - name: Load device config
        run: |
          cd openwrt

          # 使用仓库自带的 MT7981 默认配置作为基础
          cp -f defconfig/mt7981-ax3000.config .config

          # 如果用户提供了自定义 .config，则叠加
          if [ -f ../.config ]; then
            echo "===== 叠加用户自定义配置 ====="
            cat ../.config >> .config
          fi

          # 确保选中 RAX3000M NAND 设备
          cat >> .config <<EOF
          CONFIG_TARGET_mediatek_mt7981=y
          CONFIG_TARGET_mediatek_mt7981_DEVICE_cmcc_rax3000m=y
          EOF

          # mtwifi-cfg 配置 (推荐)
          if [ "${{ inputs.use_mtwifi_cfg }}" == "true" ]; then
            cat >> .config <<EOF
          CONFIG_PACKAGE_mtwifi-cfg=y
          CONFIG_PACKAGE_luci-app-mtwifi-cfg=y
          EOF
          else
            cat >> .config <<EOF
          CONFIG_PACKAGE_luci-app-mtk=y
          EOF
          fi

          # 常用闭源驱动相关插件
          cat >> .config <<EOF
          # MTK 硬件加速
          CONFIG_PACKAGE_kmod-hnat=y
          CONFIG_PACKAGE_kmod-mtk-hnat=y
          CONFIG_PACKAGE_turboacc-mtk=y
          CONFIG_PACKAGE_luci-app-turboacc-mtk=y

          # MTK QoS
          CONFIG_PACKAGE_luci-app-eqos-mtk=y

          # 无线驱动
          CONFIG_PACKAGE_kmod-mt_wifi=y
          CONFIG_PACKAGE_mt_wifi=y
          EOF

          make defconfig

          # 配置检查
          echo ""
          echo "========== 配置检查 =========="
          echo "--- 目标设备 ---"
          grep "CONFIG_TARGET.*DEVICE.*=y" .config | head -5
          echo ""
          echo "--- 无线驱动 ---"
          grep -E "CONFIG_PACKAGE.*mt_wifi|CONFIG_PACKAGE.*mtwifi" .config | head -10
          echo ""
          echo "--- 硬件加速 ---"
          grep -E "CONFIG_PACKAGE.*hnat|CONFIG_PACKAGE.*turboacc" .config | head -10
          echo ""
          echo "--- 被丢弃的包 ---"
          comm -23             <(grep "^CONFIG_PACKAGE_.*=y" ../.config 2>/dev/null | sed 's/=y//' | sort)             <(grep "^CONFIG_PACKAGE_.*=y" .config | sed 's/=y//' | sort)             || echo "(无丢弃或用户未提供 .config)"
          echo ""
          echo "--- 最终编入的 luci-app 插件 ---"
          grep "^CONFIG_PACKAGE_luci-app-.*=y" .config | sed 's/CONFIG_PACKAGE_//;s/=y//' | sort
          echo "=============================="

      # ---------- 10. 下载源码包 ----------
      - name: Download package sources
        run: |
          cd openwrt
          make download -j$(nproc)
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;

      # ---------- 11. 编译固件 ----------
      - name: Compile firmware
        run: |
          cd openwrt
          make -j$(nproc) || make -j1 V=s
          echo "===== 编译完成 ====="
          find bin/targets/ -type f -name "*.bin" -o -name "*.itb" | head -20

      # ---------- 12. 生成 Release Notes ----------
      - name: Generate Release Notes
        id: notes
        run: |
          cd openwrt
          KERNEL_VER=$(grep "LINUX_VERSION-6.6" include/kernel-6.6 2>/dev/null | awk -F'=' '{print $2}' | tr -d ' ' || echo "6.6.x")
          SYSTEM_VER=$(cat version.date 2>/dev/null || echo "24.10-SNAPSHOT")
          PLUGINS=$(grep "CONFIG_PACKAGE_luci-app-" .config | grep "=y" | sed 's/CONFIG_PACKAGE_//g' | sed 's/=y//g' | sort | tr '\n' ', ' | sed 's/,$//')

          cat > release_notes.txt <<EOF
          ### ImmortalWrt RAX3000M NAND 闭源驱动固件

          **编译时间**: $(date +"%Y-%m-%d %H:%M:%S")
          **系统版本**: ImmortalWrt $SYSTEM_VER (闭源驱动版)
          **Linux 内核**: $KERNEL_VER
          **目标设备**: CMCC RAX3000M (MT7981 / NAND 128M)
          **无线驱动**: MTK 闭源 mtwifi (含 HNAT + WARP 硬件加速)
          **无线配置**: ${{ inputs.use_mtwifi_cfg && 'mtwifi-cfg (原生 LuCI 界面)' || 'luci-app-mtk (MTK 原厂界面)' }}
          **高功率 eeprom**: ${{ inputs.use_nx30pro_eeprom && '已启用 (NX30 Pro)' || '原厂默认' }}

          ---

          ### ⚠️ 刷机须知
          1. **U-Boot 要求**: 建议使用 [hanwckf/bl-mt798x](https://github.com/hanwckf/bl-mt798x) 不死 U-Boot
          2. **首次刷机**: 使用 factory.bin 格式固件
          3. **升级固件**: 使用 sysupgrade.bin 格式固件，建议不保留配置升级
          4. **固件格式**: 本固件为 .bin 格式 (非 .itb)
          5. **默认地址**: 192.168.6.1 (immortalwrt.lan)
          6. **默认密码**: 无 (留空)

          ---

          ### 内置插件清单
          $PLUGINS

          ---

          ### 闭源驱动特性
          - ✅ MTK 原厂 mtwifi 无线驱动 (信号更强，2.4G/5G 功率更高)
          - ✅ HNAT 硬件 NAT 加速 (NAT 转发性能大幅提升)
          - ✅ WARP 无线加速
          - ✅ 802.11k/v 无缝漫游支持
          - ✅ 硬件 QoS (eqos-mtk)
          EOF

          echo "notes_file=$PWD/release_notes.txt" >> $GITHUB_OUTPUT

      # ---------- 13. 整理固件文件 ----------
      - name: Organize firmware files
        id: organize
        run: |
          cd openwrt/bin/targets/*/*
          rm -rf packages

          # 列出所有固件文件
          echo "===== 固件文件列表 ====="
          ls -lh *.bin 2>/dev/null || true
          ls -lh *.itb 2>/dev/null || true

          echo "FIRMWARE=$PWD" >> $GITHUB_ENV
          echo "status=success" >> $GITHUB_OUTPUT

      # ---------- 14. 上传 Artifact ----------
      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        if: steps.organize.outputs.status == 'success'
        with:
          name: ImmortalWrt-RAX3000M-NAND-ClosedSource-${{ github.run_number }}
          path: |
            ${{ env.FIRMWARE }}/*.bin
            ${{ env.FIRMWARE }}/*.itb

      # ---------- 15. 发布 Release ----------
      - name: Release to GitHub
        uses: softprops/action-gh-release@v2
        if: steps.organize.outputs.status == 'success' && inputs.release == true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: RAX3000M-NAND-CS-${{ github.run_number }}
          name: ImmortalWrt-RAX3000M-NAND-ClosedSource-Build-${{ github.run_number }}
          body_path: openwrt/release_notes.txt
          files: |
            ${{ env.FIRMWARE }}/*.bin
            ${{ env.FIRMWARE }}/*.itb
