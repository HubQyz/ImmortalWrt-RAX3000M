name: Build ImmortalWrt RAX3000M

on:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: openwrt-25.12
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Init environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt update -y
          sudo apt install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-distutils python3-setuptools rsync swig unzip zlib1g-dev file wget

      - name: Clone source
        run: |
          git clone --depth=1 $REPO_URL -b $REPO_BRANCH openwrt || git clone --depth=1 $REPO_URL openwrt

      - name: Add feeds
        run: |
          cd openwrt
          echo "src-git small https://github.com/kenzok8/small.git" >> feeds.conf.default
          echo "src-git kenzok8 https://github.com/kenzok8/openwrt-packages.git" >> feeds.conf.default
          echo "src-git istore https://github.com/linkease/istore.git" >> feeds.conf.default
          echo "src-git momo https://github.com/nikkinikki-org/OpenWrt-momo.git;main" >> feeds.conf.default

      - name: Update feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Load config
        run: |
          cd openwrt
          cp ../.config .config
          make defconfig

      - name: Download
        run: |
          cd openwrt
          make download -j8

      - name: Compile
        run: |
          cd openwrt
          make -j$(nproc) || make -j1 V=s

      - name: Generate Release Notes
        id: notes
        run: |
          cd openwrt
          KERNEL_VER=$(grep "LINUX_VERSION-6.12" include/kernel-6.12 | awk -F'=' '{print $2}' | tr -d ' ')
          if [ -z "$KERNEL_VER" ]; then KERNEL_VER="6.12.x"; fi
          SYSTEM_VER=$(cat version.date 2>/dev/null || echo "25.12-SNAPSHOT")
          PLUGINS=$(grep "CONFIG_PACKAGE_luci-app-" .config | grep "=y" | sed 's/CONFIG_PACKAGE_//g' | sed 's/=y//g' | sort | tr '\n' ', ' | sed 's/,$//')
          
          cat > release_notes.txt <<EOF
          ### 🚀 ImmortalWrt RAX3000M 专属固件 (Momo + PT 满血版)
          
          **编译时间**: $(date +"%Y-%m-%d %H:%M:%S")
          **系统版本**: ImmortalWrt $SYSTEM_VER
          **Linux 内核**: $KERNEL_VER
          **目标设备**: CMCC RAX3000M (MT7981 / NAND 128M)
          
          ---
          
          ### 📦 内置插件清单
          $PLUGINS
          
          ---
          
          ### 💡 刷机提示
          *   **首次刷机**: 请使用 `factory.bin`
          *   **升级固件**: 请使用 `sysupgrade.bin`
          EOF
          
          echo "notes_file=$PWD/release_notes.txt" >> $GITHUB_OUTPUT

      - name: Organize
        id: organize
        run: |
          cd openwrt/bin/targets/*/*
          rm -rf packages
          echo "FIRMWARE=$PWD" >> $GITHUB_ENV
          echo "status=success" >> $GITHUB_OUTPUT

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: ImmortalWrt-RAX3000M
          path: ${{ env.FIRMWARE }}

      - name: Release
        uses: softprops/action-gh-release@v2
        if: steps.organize.outputs.status == 'success'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: RAX3000M-${{ github.run_number }}
          name: ImmortalWrt-RAX3000M-Build-${{ github.run_number }}
          body_path: openwrt/release_notes.txt
          files: ${{ env.FIRMWARE }}/*
